[package]
name = "claude_statusline"
version = "2.11.2"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6.1", features = ["derive","env"] }
owo-colors = { version = "4.0", optional = true }
directories = "6.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
gix = { version = "0.86", default-features = false, features = ["revision", "status", "sha1"], optional = true }
once_cell = "1.19"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
rustls-native-certs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
terminal_size = "0.4.4"
walkdir = "2.5.0"
unicode-width = "0.2.2"

[features]
default = ["git", "colors"]
git = ["dep:gix"]
colors = ["dep:owo-colors"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true


[dev-dependencies]
tempfile = "3.10"
serial_test = "3.0"
